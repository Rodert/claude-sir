<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>环境信号检测</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f7f7f8; }
    claude-env-detector { min-height: 100vh; }
  </style>
</head>
<body>
  <claude-env-detector id="detector"></claude-env-detector>
  <script src="src/detector.js"></script>
  <script src="src/claude-env-detector.js"></script>
  <script>
    const detector = document.getElementById("detector");
    detector.addEventListener("claude-env-result", (event) => {
      if (window.parent !== window) {
        window.parent.postMessage({
          type: "claude-env-result",
          report: event.detail
        }, "*");
      }
    });
    detector.addEventListener("claude-env-locale", (event) => {
      const locale = event.detail.locale;
      document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      document.title = locale === "zh" ? "环境信号检测" : "Environment Signal Detector";
      if (window.parent !== window) {
        window.parent.postMessage({
          type: "claude-env-locale",
          locale
        }, "*");
      }
    });
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "claude-env-run") detector.run();
      if (event.data && event.data.type === "claude-env-locale") {
        detector.locale = event.data.locale;
      }
    });
  </script>
</body>
</html>
